[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

# Shipping build used by scripts/package.sh (`cargo build --profile dist`). `release` stays
# untouched so `cargo build --release` remains fast for iteration.
[profile.dist]
inherits = "release"
# Whole-program LTO + one codegen unit: ~27% smaller than release, merge/unlock as fast or faster.
lto = "fat"
codegen-units = 1
# Ship a stripped binary; line tables go to target/dist/vault-app.dSYM for crash symbolication
# (`atos -o Vault.app.dSYM -arch arm64 -l <load-addr> <addr>`).
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
# panic stays "unwind": catch_unwind boundaries (KDBX parser, background tasks) need it.
