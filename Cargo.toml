[workspace]
members = ["crates/*"]
# Vendored, patched keepass (see vendor/keepass/VAULT-PATCH.md): built through [patch] below,
# not as a member, so its own test suite runs with its own lockfile.
exclude = ["vendor/keepass"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

# Shipping build used by scripts/package.sh (`cargo build --profile dist`). `release` stays
# untouched so `cargo build --release` remains fast for iteration.
[profile.dist]
inherits = "release"
# Whole-program LTO + one codegen unit: ~27% smaller than release, merge/unlock as fast or faster.
lto = "fat"
codegen-units = 1
# Ship a stripped binary; line tables go to target/dist/vault-app.dSYM for crash symbolication
# (`atos -o Vault.app.dSYM -arch arm64 -l <load-addr> <addr>`).
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
# Parsers handle attacker-controlled lengths; a panic is better than a silently wrapped value.
overflow-checks = true
# panic stays "unwind": catch_unwind boundaries (KDBX parser, background tasks) need it.

# Dev profile: deps at opt-level 1 so Argon2, gpui and friends are usable in tests; our crates stay at 0.
[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.vault-app]
# No debuginfo for the app crate: each debug rebuild otherwise leaves ~256 stale .o files in target/debug/deps.
debug = false

# keepass 0.17.0 inflates gzip payloads without a bound (security review 2026-11-26, M-05).
# Local copy with a capped inflate; drop once upstream ships the fix (vendor/keepass/VAULT-PATCH.md).
[patch.crates-io]
keepass = { path = "vendor/keepass" }
