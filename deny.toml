# cargo-deny configuration. Routine use:
#   cargo deny check
#   cargo audit            (run in the repo root and in qa/spec-checks)

[graph]
# macOS-only product (CLAUDE.md): do not evaluate linux/windows/wasm-only crates pulled in by gpui.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace" # transitive unmaintained crates are surfaced as warnings by `cargo audit`
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD", # enum-iterator(-derive) via gpui-component; permissive
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps carry no version
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
